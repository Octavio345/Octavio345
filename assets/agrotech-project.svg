<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="660" viewBox="0 0 1400 660">
  <defs>
    <linearGradient id="b" x1="0" y1="0" x2="1400" y2="660">
      <stop stop-color="#050907"/>
      <stop offset="1" stop-color="#0C2115"/>
    </linearGradient>
    <pattern id="g" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#183422" stroke-width="1" opacity=".45"/>
    </pattern>
    <style>
      .pipe{stroke-dasharray:8 12;animation:p 8s linear infinite}
      .scan{animation:s 4.5s ease-in-out infinite}
      .blink{animation:b 2.6s ease-in-out infinite}
      .float-inner{animation:f 4s ease-in-out infinite}
      @keyframes p{to{stroke-dashoffset:-240}}
      @keyframes s{0%,100%{transform:translateX(0);opacity:.15}50%{transform:translateX(180px);opacity:.8}}
      @keyframes b{0%,100%{opacity:.35}50%{opacity:1}}
      @keyframes f{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
    </style>
  </defs>

  <rect width="1400" height="660" rx="34" fill="url(#b)"/>
  <rect width="1400" height="660" rx="34" fill="url(#g)"/>

  <text x="70" y="76" fill="#73A982" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="800" letter-spacing="3">
    PROJETO EM DESTAQUE • TCC AGROTECH
  </text>

  <text x="70" y="128" fill="#F3FFF6" font-family="Segoe UI,Arial,sans-serif" font-size="46" font-weight="900">
    Zenith
  </text>

  <text x="70" y="168" fill="#B7FFC3" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700">
    Sua precisão agrícola no ponto mais alto
  </text>

  <text x="70" y="206" fill="#9AB7A2" font-family="Segoe UI,Arial,sans-serif" font-size="17">
    Da captura da imagem ao resultado estruturado no backend.
  </text>

  <path class="pipe" d="M258 370H418M626 370H786M994 370H1150" fill="none" stroke="#63E67A" stroke-width="2" opacity=".52"/>

  <g transform="translate(70 260)">
    <g class="float-inner">
      <rect width="188" height="220" rx="24" fill="#08150D" stroke="#2A5D3B"/>
      <text x="24" y="34" fill="#73A982" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="800" letter-spacing="2">01 • CAPTURA</text>
      <g transform="translate(94 96)">
        <path d="M-42 0h84M0 0v26M-28-8l-30-16M28-8l30-16" stroke="#A9FFB7" stroke-width="4" stroke-linecap="round"/>
        <rect x="-24" y="-18" width="48" height="34" rx="12" fill="#0D2818" stroke="#63E67A"/>
        <circle r="7" fill="#63E67A"/>
      </g>
      <text x="24" y="172" fill="#F3FFF6" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="800">Campo / Drone</text>
      <text x="24" y="197" fill="#92AE99" font-family="Segoe UI,Arial,sans-serif" font-size="13">imagens da lavoura</text>
    </g>
  </g>

  <g transform="translate(418 260)">
    <rect width="208" height="220" rx="24" fill="#08150D" stroke="#2A5D3B"/>
    <text x="24" y="34" fill="#73A982" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="800" letter-spacing="2">02 • PROCESSAMENTO</text>
    <rect x="28" y="65" width="152" height="82" rx="15" fill="#0C2115" stroke="#39794F"/>
    <path d="M38 133c28-42 48-20 68-52 13 25 30 13 64 50" fill="none" stroke="#63E67A" stroke-width="3"/>
    <g class="scan">
      <rect x="38" y="72" width="3" height="68" fill="#B7FFC3"/>
    </g>
    <text x="24" y="172" fill="#F3FFF6" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="800">OpenCV + NumPy</text>
    <text x="24" y="197" fill="#92AE99" font-family="Segoe UI,Arial,sans-serif" font-size="13">segmentação e análise visual</text>
  </g>

  <g transform="translate(786 260)">
    <rect width="208" height="220" rx="24" fill="#08150D" stroke="#2A5D3B"/>
    <text x="24" y="34" fill="#73A982" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="800" letter-spacing="2">03 • INTELIGÊNCIA</text>
    <g transform="translate(104 106)" fill="none" stroke="#63E67A" stroke-width="2">
      <circle r="20"/>
      <circle cx="-48" cy="-28" r="8"/>
      <circle cx="50" cy="-30" r="8"/>
      <circle cx="-50" cy="32" r="8"/>
      <circle cx="48" cy="34" r="8"/>
      <path d="M-19-8l-22-15M19-8l24-17M-18 10l-25 17M18 11l23 18"/>
    </g>
    <text x="24" y="172" fill="#F3FFF6" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="800">TensorFlow / ML</text>
    <text x="24" y="197" fill="#92AE99" font-family="Segoe UI,Arial,sans-serif" font-size="13">classificação de doenças</text>
  </g>

  <g transform="translate(1150 260)">
    <rect width="180" height="220" rx="24" fill="#08150D" stroke="#2A5D3B"/>
    <text x="24" y="34" fill="#73A982" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="800" letter-spacing="2">04 • API</text>
    <g transform="translate(30 67)" fill="#0D2818" stroke="#63E67A">
      <rect width="120" height="22" rx="8"/>
      <rect y="32" width="120" height="22" rx="8"/>
      <rect y="64" width="120" height="22" rx="8"/>
    </g>
    <g fill="#63E67A" class="blink">
      <circle cx="46" cy="78" r="3"/>
      <circle cx="46" cy="110" r="3"/>
      <circle cx="46" cy="142" r="3"/>
    </g>
    <text x="24" y="172" fill="#F3FFF6" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="800">FastAPI</text>
    <text x="24" y="197" fill="#92AE99" font-family="Segoe UI,Arial,sans-serif" font-size="13">resultado estruturado</text>
  </g>

  <g transform="translate(70 530)">
    <rect width="1260" height="78" rx="22" fill="#07110C" stroke="#234A31"/>
    <text x="26" y="31" fill="#73A982" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="800" letter-spacing="2">O QUE O SISTEMA OBSERVA</text>
    <text x="26" y="57" fill="#E8F9ED" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">
      doenças da soja   •   falhas de plantio   •   densidade   •   uniformidade   •   regiões fora do padrão
    </text>
  </g>
</svg>